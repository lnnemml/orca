[package]
name = "orcastudio"
version = "0.1.0"
description = "OrcaStudio — desktop GUI for the ORCA quantum chemistry package"
authors = ["OrcaStudio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orcastudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
dirs = "5"
# Sidecar lifecycle (Phase 0): spawn uvicorn, poll /health.
ureq = "2"
# Job identifiers (Phase 1): UUID v4 primary keys.
uuid = { version = "1", features = ["v4"] }
# Result extraction (Phase 1): regex over ORCA output tails.
regex = "1"
tauri-plugin-dialog = "2"

# Job cancellation (Phase 2): killpg the ORCA MPI process group. Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

