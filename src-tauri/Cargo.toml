[package]
name = "orcastudio"
version = "0.1.0"
description = "OrcaStudio — desktop GUI for the ORCA quantum chemistry package"
authors = ["OrcaStudio"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orcastudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# Identity core (ADR-016). The artifact readers take its `IndexMap<OrcaIndex>` in
# the verify() path (unit 1d): the emit_input/parse_output pair becomes typed
# in-process (same crate on both sides) and cross-checked at the persistence
# boundary. Path dependency; std-only, adds no third-party crate.
orcastudio-core = { path = "../orcastudio-core" }
dirs = "5"
# Sidecar lifecycle (Phase 0): spawn uvicorn, poll /health.
ureq = "2"
# Job identifiers (Phase 1): UUID v4 primary keys.
uuid = { version = "1", features = ["v4"] }
# Result extraction (Phase 1): regex over ORCA output tails.
regex = "1"
tauri-plugin-dialog = "2"
# Manual objects.inv (Phase 4.2, ADR-013): decompress the zlib stream in the
# Sphinx inventory v2. Already transitive in Cargo.lock (1.1.9) — this adds only
# the declaration, no new crate enters the build.
flate2 = "1"
# Anthropic API key in the OS credential store (Phase 4, ADR-015). Default Linux
# backend is pure-Rust zbus-secret-service — no libsecret/libdbus C dependency
# (measured: wiki/architecture/keyring-availability.md). The HTTP call reuses the
# existing `ureq` (rustls TLS) — no new HTTP dependency.
keyring = "4.1.6"

# Job cancellation (Phase 2): killpg the ORCA MPI process group. Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

